<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OG Card Preview – Gebrüder Ross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #fff;
}
.og-canvas {
  width: 1200px;
  height: 630px;
  background: radial-gradient(circle at 50% 38%, #183352 0%, #0e1f33 55%, #07101a 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 50px 80px;
}

/* Subtle background grid & ambient light */
.og-canvas::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(185, 152, 90, 0.1) 1px, transparent 1px);
  background-size: 36px 36px;
  opacity: 0.6;
  pointer-events: none;
}
.ambient-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 650px;
  height: 450px;
  background: radial-gradient(circle, rgba(185, 152, 90, 0.2) 0%, rgba(22, 48, 77, 0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

/* Luxury frame border */
.card-frame {
  position: absolute;
  inset: 24px;
  border: 1px solid rgba(185, 152, 90, 0.25);
  border-radius: 16px;
  pointer-events: none;
}
.card-frame::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(185, 152, 90, 0.1);
  border-radius: 10px;
}

/* Central Content Container (Safe Zone) */
.content-stack {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 960px;
}

/* Logo */
.logo-wrap {
  margin-bottom: 24px;
  position: relative;
}
.logo-wrap img {
  height: 160px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 35px rgba(185, 152, 90, 0.35));
}

/* Brand Name */
.brand-name {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #ffffff;
  margin-bottom: 12px;
  text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
}

/* Divider */
.divider {
  width: 64px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #b9985a, transparent);
  margin-bottom: 16px;
}

/* Claim / Headline */
.claim {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 58px;
  line-height: 1.15;
  font-weight: 700;
  font-style: italic;
  color: #dfc58e;
  margin-bottom: 16px;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 40px rgba(185, 152, 90, 0.25);
  letter-spacing: -0.01em;
}

/* Sub-location / Tagline */
.sub-tag {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.8);
  padding: 8px 22px;
  background: rgba(14, 31, 51, 0.6);
  border: 1px solid rgba(185, 152, 90, 0.3);
  border-radius: 30px;
  backdrop-filter: blur(8px);
}
</style>
</head>
<body>

<div class="og-canvas">
  <div class="card-frame"></div>
  <div class="ambient-glow"></div>

  <div class="content-stack">
    <!-- Official Logo Icon -->
    <div class="logo-wrap">
      <img src="logo_icon.png" alt="Gebrüder Ross Signet">
    </div>

    <!-- Brand Name -->
    <div class="brand-name">Gebrüder Ross</div>

    <!-- Gold Divider -->
    <div class="divider"></div>

    <!-- Core Headline -->
    <div class="claim">Ihr verlängerter Arm vor Ort.</div>

    <!-- Sub Tag -->
    <div class="sub-tag">Nachlassservice · Großraum Stuttgart</div>
  </div>
</div>

</body>
</html>
