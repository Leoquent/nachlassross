<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193554"/>
      <stop offset="100%" stop-color="#0a1624"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc58e"/>
      <stop offset="50%" stop-color="#b9985a"/>
      <stop offset="100%" stop-color="#93753a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#navyBg)"/>
  
  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Serif Monogram GR as pure vectors -->
  <g filter="url(#shadow)">
    <!-- Letter G -->
    <path d="M228 178 C216 160 196 148 168 148 C122 148 88 188 88 256 C88 324 122 364 168 364 C204 364 228 344 234 308 L176 308 L176 276 L262 276 L262 316 C252 358 218 392 168 392 C104 392 56 338 56 256 C56 174 104 120 168 120 C206 120 236 138 252 166 Z" fill="url(#goldGrad)"/>
    
    <!-- Letter R -->
    <path d="M280 126 L368 126 C412 126 444 148 444 196 C444 234 420 258 386 264 L456 386 L416 386 L352 272 L312 272 L312 386 L280 386 Z M312 154 L312 244 L366 244 C394 244 412 230 412 198 C412 168 394 154 366 154 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
